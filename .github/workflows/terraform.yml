name: 'Terraform CI/CD'

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v2

      - name: 'Terraform Init'
        run: terraform init

      - name: 'Terraform Plan'
        run: terraform plan -out=tfplan

      - name: 'Upload Plan Artifact'
        uses: actions/upload-artifact@v3
        with:
          name: tfplan
          path: tfplan

  apply:
    name: 'Terraform Apply'
    runs-on: ubuntu-latest
    needs: plan
    # Use an environment with a required reviewer for manual approval
    environment:
      name: production
      url: 'https://github.com' # Placeholder URL

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v3

      - name: 'Setup Terraform'
        uses: hashicorp/setup-terraform@v2

      - name: 'Download Plan Artifact'
        uses: actions/download-artifact@v3
        with:
          name: tfplan

      - name: 'Terraform Init'
        run: terraform init

      - name: 'Terraform Apply'
        run: terraform apply -auto-approve "tfplan"
